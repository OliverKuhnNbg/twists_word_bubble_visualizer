<div class="card shadow-sm border-0">
  <div
    class="card-header bg-dark text-white d-flex justify-content-between align-items-center"
  >
    <span>Word Cloud Canvas</span>
    @if (store.isProcessing()) {
    <span class="spinner-border spinner-border-sm" role="status"></span>
    }
  </div>

  <div class="card-body p-0">
    <svg
      viewBox="0 0 800 500"
      class="w-100 d-block bg-light"
      role="img"
      aria-label="Word Cloud Visualisierung"
    >
      @for (word of store.processedWords(); track word.text) {
      <text
        text-anchor="middle"
        [attr.font-size]="word.size"
        [attr.transform]="'translate(' + word.x + ',' + word.y + ') rotate(' + word.rotate + ')'"
        class="cloud-word"
      >
        {{ word.text }}
      </text>
      } @empty {
      <text x="400" y="250" text-anchor="middle" fill="#6c757d" font-size="18">
        Text eingeben, um Wörter zu visualisieren...
      </text>
      }
    </svg>
  </div>
</div>
